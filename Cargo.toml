[workspace]
resolver = "3"
members = [
    "crates/titi-core",
    "crates/titi-config",
    "crates/titi-soul",
    "crates/titi-memory",
    "crates/titi-providers",
    "crates/titi-engine",
    "crates/titi-tools",
    "crates/titi-tui",
    "crates/titi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/workie/titi"

[workspace.dependencies]
titi-config = { path = "crates/titi-config" }
titi-core = { path = "crates/titi-core" }
titi-engine = { path = "crates/titi-engine" }
titi-providers = { path = "crates/titi-providers" }
titi-soul = { path = "crates/titi-soul" }
titi-memory = { path = "crates/titi-memory" }
titi-secrets = { path = "crates/titi-secrets" }
titi-tools = { path = "crates/titi-tools" }
titi-tui = { path = "crates/titi-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
